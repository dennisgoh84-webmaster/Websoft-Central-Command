# Central Command — see DEPLOY.md for the full runbook.
# Run from the repository root:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build

services:
  cc-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cc_app
      POSTGRES_PASSWORD: ${CC_POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_DB: central_command
    ports:
      # Bound to loopback only: reachable from the host for psql/backups,
      # never from the network. Remove the 127.0.0.1 prefix deliberately
      # if a remote DB client is truly needed (and firewall it).
      - "127.0.0.1:${CC_DB_PORT:-5433}:5432"
    volumes:
      - cc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc_app -d central_command"]
      interval: 5s
      timeout: 5s
      retries: 10

  cc-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_KEY: ${CC_APP_KEY:?set a real app key in .env}
      APP_ENV: ${CC_ENVIRONMENT:-testing}
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: cc-db
      DB_PORT: 5432
      DB_DATABASE: central_command
      DB_USERNAME: cc_app
      DB_PASSWORD: ${CC_POSTGRES_PASSWORD:?set a real password in .env}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      CC_JWT_SECRET_KEY: ${CC_JWT_SECRET_KEY:?set a real random secret in .env}
      CC_ENVIRONMENT: ${CC_ENVIRONMENT:-testing}
      CC_UPGRADE_AGENT_TOKEN: ${CC_UPGRADE_AGENT_TOKEN:-}
    depends_on:
      cc-db:
        condition: service_healthy

  cc-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # CC_HTTP_BIND=127.0.0.1 once HTTPS is in front (scripts/setup-https.sh):
      # the plain-HTTP port is then reachable from this server only, which is
      # all the reverse proxy and the upgrade agent need.
      - "${CC_HTTP_BIND:-0.0.0.0}:${CC_HTTP_PORT:-8080}:80"
    depends_on:
      cc-backend:
        condition: service_healthy

volumes:
  cc_pgdata:
